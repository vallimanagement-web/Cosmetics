name: Build Vallicosmo

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - name: Build
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "settings.gradle nicht gefunden. Das liegt im Repo:"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          DIR=$(dirname "$F")
          echo "Projekt liegt in: $DIR"
          cd "$DIR"
          gradle build
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/vallicosmo-1.0.0.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: vallicosmo-jar
          path: out/vallicosmo-1.0.0.jar
